<div class="forgot-page">

  <div class="forgot-bg-grid"></div>

  <div class="forgot-glow forgot-glow-1"></div>
  <div class="forgot-glow forgot-glow-2"></div>


  <!-- HEADER -->

  <header class="forgot-header">

    <a
      routerLink="/"
      class="brand"
    >
      <div class="brand-icon">
        B
      </div>

      <span>
        Bill<span>Pro</span>
      </span>
    </a>

    <a
      routerLink="/login"
      class="back-login"
    >
      ← Back to Login
    </a>

  </header>


  <!-- CONTENT -->

  <main class="forgot-container">

    <div class="forgot-card">

      <div class="forgot-top">

        <div class="forgot-icon">
          🔐
        </div>

        <h1>
          Forgot Password?
        </h1>

        <p>
          Enter your email address and we'll send you
          a password reset link.
        </p>

      </div>


      <form
        #forgotForm="ngForm"
        (ngSubmit)="sendResetLink()"
      >

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              ✉
            </span>

            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              required
              email
              autocomplete="email"
            />

          </div>

        </div>


        <button
          type="submit"
          class="reset-button"
          [disabled]="!forgotForm.valid"
        >
          <span>
            Send Reset Link
          </span>

          <span>
            →
          </span>
        </button>

      </form>


      <div class="back-login-section">

        Remember your password?

        <a routerLink="/login">
          Login
        </a>

      </div>


      <div class="security">

        <span>
          🔐
        </span>

        <span>
          Your data is protected with secure encryption.
        </span>

      </div>

    </div>

  </main>


  <footer class="forgot-footer">
    © 2026 BillPro. All rights reserved.
  </footer>

</div>
